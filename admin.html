<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Euromedica Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Euromedica Admin — desktop CMS. Tokens mirror the member app (design-tokens.json). */
:root{
  --n0:#FFFFFF;--n25:#FBF8F4;--n50:#F6F1EC;--n100:#EFE8E1;--n150:#E6DDD5;--n200:#D9CEC4;--n400:#A2958B;--n600:#6B5F57;--n800:#3A2F29;--n900:#241C18;
  --m50:#F9F1F4;--m100:#F2E4EA;--m200:#E3C7D3;--m300:#C99AAF;--m500:#8E4463;--m600:#6E2F4A;--m700:#5A263C;--m800:#451D2E;--m900:#2E1320;
  --gold:#E8B98A;--gold-l:#F6DDBF;
  --skin:#2F5AA8;--slim:#2E7D4F;--esl:#B04A7A;--ehl:#1F6E6A;--esc:#A33B2A;
  --ok-bg:#E6F0E9;--ok:#2C7249;--warn-bg:#FBF1E4;--warn:#8A5A12;--bad-bg:#FCEBEB;--bad:#B3261E;--info-bg:#E4EAF5;--info:#2F5AA8;
  --bg:var(--n50);--surface:var(--n0);--line:#E8DFD8;--ink:var(--n900);--ink2:var(--n600);--ink3:var(--n400);
  --f-ui:'Manrope',system-ui,-apple-system,sans-serif;--f-disp:'Instrument Serif',Georgia,serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
  --r:14px;--r-lg:20px;--sh:0 1px 0 rgba(36,28,24,.04),0 10px 30px -22px rgba(36,28,24,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--m600);outline-offset:2px}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:radial-gradient(120% 50% at 0% 0%,rgba(232,185,138,.16),transparent 60%),var(--m900);color:#F3E9EE;overflow-y:auto}
.brandmk{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brandmk svg{width:28px;height:28px;fill:var(--gold-l)}
.brandmk b{display:block;font:800 14px/1 var(--f-ui);letter-spacing:.8px}
.brandmk small{display:block;margin-top:4px;font:600 11px/1 var(--f-ui);color:rgba(243,233,238,.6)}
.nav-g{margin:14px 10px 6px;font:700 10.5px/1 var(--f-ui);letter-spacing:1.3px;text-transform:uppercase;color:rgba(243,233,238,.45)}
.nav a,.nav span.soon{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:rgba(243,233,238,.82);text-decoration:none;font:600 13.5px/1.2 var(--f-ui)}
.nav a svg,.nav span.soon svg{width:18px;height:18px;flex:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:rgba(246,221,191,.14);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav .bdg{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--gold);color:var(--m900);font:800 11px/1 var(--f-ui)}
.nav span.soon{opacity:.42;cursor:not-allowed}
.nav span.soon em{margin-left:auto;font-style:normal;font:700 9.5px/1 var(--f-ui);letter-spacing:.6px;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.1)}
.side-ft{margin-top:auto;padding:14px 10px 2px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:10px}
.side-ft a{color:var(--gold-l);font:700 12.5px/1.3 var(--f-ui);text-decoration:none}
.side-ft small{font:500 11.5px/1.4 var(--f-ui);color:rgba(243,233,238,.55)}
/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(246,241,236,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font:400 30px/1.05 var(--f-disp);letter-spacing:-.2px}
.top .crumb{font:600 12px/1 var(--f-ui);color:var(--ink3);margin-bottom:5px}
.top .grow{flex:1}
.sbox{display:flex;align-items:center;gap:8px;width:260px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink3)}
.sbox svg{width:17px;height:17px;flex:none}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13.5px;color:var(--ink)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--n100)}
.seg button{min-width:40px;height:32px;padding:0 12px;border:0;border-radius:999px;background:none;font:700 12.5px/1 var(--f-ui);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--m700);box-shadow:0 1px 3px rgba(36,28,24,.15)}
.me{display:flex;align-items:center;gap:10px}
.me i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--m600);color:#fff;font:800 12.5px/1 var(--f-ui);font-style:normal}
.me b{display:block;font:700 13px/1.2 var(--f-ui)}
.me small{display:block;font:500 11.5px/1.2 var(--f-ui);color:var(--ink3)}
.content{padding:24px 28px 60px;display:flex;flex-direction:column;gap:20px}
/* common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.card-h h2{margin:0;font:700 15px/1.3 var(--f-ui)}
.card-h small{font:500 12.5px/1.3 var(--f-ui);color:var(--ink3)}
.card-h .sp{flex:1}
.card-b{padding:16px 20px 20px}
.row{display:grid;gap:20px}
.c-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.c-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.c-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;font:700 13px/1 var(--f-ui);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--m600);color:#fff}
.btn-p:hover{background:var(--m700)}
.btn-s{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-s:hover{background:var(--n25)}
.btn-g{background:none;color:var(--m600);padding:0 8px}
.btn-d{background:var(--bad-bg);color:var(--bad)}
.btn-sm{height:32px;padding:0 12px;font-size:12px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font:700 11.5px/1 var(--f-ui);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--n100);color:var(--ink2)}.p-m{background:var(--m100);color:var(--m700)}
.btag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:800 10.5px/1 var(--f-ui);letter-spacing:.4px;color:#fff;background:var(--bc,var(--m600))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.src{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;background:var(--gold-l);color:var(--m800);font:800 10px/1 var(--f-ui);letter-spacing:.4px;text-transform:uppercase}
/* KPI */
.kpi{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi small{font:600 12px/1.2 var(--f-ui);color:var(--ink2)}
.kpi b{font:700 26px/1.05 var(--f-ui);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .dl{display:flex;align-items:center;gap:6px;font:700 12px/1 var(--f-ui)}
.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.dl span{font-weight:500;color:var(--ink3)}
.kpi canvas{height:34px!important;margin-top:2px}
.kpi.live{box-shadow:0 0 0 2px var(--gold),var(--sh)}
.chart{position:relative;height:280px}
.chart.sm{height:220px}
/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;text-align:left;padding:10px 14px;font:700 11px/1.2 var(--f-ui);letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);background:var(--n25);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.fresh td{background:#FFF8EE}
.tbl tbody tr:hover td{background:var(--n25)}
.tbl .who b{display:block;font-weight:700}
.tbl .who small{display:block;font-size:12px;color:var(--ink3)}
.tbl-wrap{overflow:auto;border-radius:0 0 var(--r-lg) var(--r-lg)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.toolbar select,.fld input,.fld select,.fld textarea{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.fld textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:700 12.5px/1 var(--f-ui);color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--m600);border-color:var(--m600);color:#fff}
.chip i{font-style:normal;margin-left:6px;opacity:.75}
/* lists */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--m50);color:var(--m600)}
.feed .ic svg{width:17px;height:17px}
.feed b{display:block;font:700 13px/1.35 var(--f-ui)}
.feed small{display:block;font:500 12px/1.35 var(--f-ui);color:var(--ink3)}
.bar{height:8px;border-radius:999px;background:var(--n100);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--m500),var(--gold))}
.emo{font-size:20px;line-height:1}
/* promo */
.promo{display:grid;grid-template-columns:120px minmax(0,1fr) 300px;gap:20px;padding:20px;align-items:center}
.promo + .promo{border-top:1px solid var(--line)}
.promo .ph{width:120px;height:120px;border-radius:16px;overflow:hidden;background:var(--n100);display:grid;place-items:center;color:#fff;font:800 13px/1 var(--f-ui)}
.promo h3{margin:6px 0 4px;font:700 17px/1.3 var(--f-ui)}
.promo .pr{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.promo .pr b{font:700 18px/1 var(--f-mono)}
.promo .pr s{color:var(--ink3);font:500 13px/1 var(--f-mono)}
.ctl{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--n25);border:1px solid var(--line)}
.ctl label{font:700 12px/1.2 var(--f-ui);color:var(--ink2)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 18px/1 var(--f-ui)}
.stepper input{width:76px;height:36px;text-align:center;border-radius:10px;border:1px solid var(--line);font:700 15px/1 var(--f-mono)}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font:700 13px/1 var(--f-ui)}
.sw input{position:absolute;opacity:0}
.sw i{width:42px;height:24px;border-radius:999px;background:var(--n200);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--m600);outline-offset:2px}
/* voucher cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px}
.vc{display:grid;grid-template-columns:86px minmax(0,1fr);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.vc .st{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--bc);color:#fff;font:800 11px/1.15 var(--f-ui);text-align:center;padding:10px 6px;letter-spacing:.3px}
.vc .st small{font:600 9.5px/1 var(--f-mono);opacity:.85;letter-spacing:.8px}
.vc .bd{display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;border-left:2px dashed var(--line);min-width:0}
.vc .bd b{font:700 14px/1.3 var(--f-ui)}
.vc .bd small{font:500 12px/1.3 var(--f-ui);color:var(--ink3)}
.vc .ft{display:flex;align-items:center;gap:8px;margin-top:4px}
.vc .ft .sp{flex:1}
/* feedback */
.fb-wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.fbi{display:flex;gap:14px;width:100%;padding:16px 20px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.fbi:hover{background:var(--n25)}
.fbi[aria-current="true"]{background:var(--m50);box-shadow:inset 3px 0 0 var(--m600)}
.fbi .emo{font-size:26px;width:34px;text-align:center}
.fbi .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fbi .tx b{font:700 13.5px/1.3 var(--f-ui)}
.fbi .tx p{margin:0;font:500 13px/1.45 var(--f-ui);color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fbi .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 11.5px/1 var(--f-ui);color:var(--ink3)}
.fbd{position:sticky;top:92px;display:flex;flex-direction:column;gap:16px;padding:20px}
.fbd h3{margin:0;font:400 26px/1.15 var(--f-disp)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--ink3);font-weight:600}
.kv dd{margin:0;font-weight:700}
.quote{margin:0;padding:12px 14px;border-radius:12px;background:var(--n25);border-left:3px solid var(--m300);font:500 13.5px/1.5 var(--f-ui);color:var(--ink2)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font:700 12px/1.2 var(--f-ui);color:var(--ink2)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(36,28,24,.42);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(460px,100%);display:flex;flex-direction:column;background:var(--surface);box-shadow:-20px 0 40px -20px rgba(36,28,24,.4)}
.drawer header{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;flex:1;font:400 26px/1.1 var(--f-disp)}
.drawer .db{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.drawer footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line)}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ib svg{width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--n25)}
.preview small{display:block;margin-bottom:8px;font:700 11px/1 var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:28px;z-index:40;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;background:var(--n900);color:#fff;font:600 13px/1.3 var(--f-ui);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font:600 12.5px/1.45 var(--f-ui)}
.note svg{width:16px;height:16px;flex:none;margin-top:1px}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}
.live-dot{display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1 var(--f-ui);color:var(--ok)}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(44,114,73,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(44,114,73,0)}100%{box-shadow:0 0 0 0 rgba(44,114,73,0)}}
@media (prefers-reduced-motion:reduce){.live-dot i{animation:none}.toast{transition:none}}
@media (max-width:1180px){.c-5{grid-template-columns:repeat(3,minmax(0,1fr))}.c-2-1,.fb-wrap{grid-template-columns:1fr}.promo{grid-template-columns:96px minmax(0,1fr)}.promo .ctl{grid-column:1/-1}.fbd{position:static}.sbox{display:none}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.c-5,.c-1-1,.c-3{grid-template-columns:1fr 1fr}}
/* ===== members, clinics, flash-sale settings ===== */
.fbi .emo.mav,.emo.mav{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:#F3E7EC;color:#6E2F4A;font:700 13px/1 var(--f-ui)}
.mq{width:100%;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font:500 13px/1 var(--f-ui);background:var(--surface)}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mstat div{padding:12px 14px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:4px}
.mstat small{font:600 11.5px/1.2 var(--f-ui);color:var(--ink2)}
.mstat b{font:700 20px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.mstat em{font:700 11px/1 var(--f-ui);font-style:normal;color:#B4690E}
.mh{margin:6px 0 -4px;font:700 12px/1 var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}
.mhist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px}
.mhist li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}
.ckl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.ckl label{display:flex;align-items:center;gap:8px;font-weight:500}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigasi admin">
    <div class="brandmk"><svg viewBox="0 0 320 320" aria-hidden="true"><g transform="translate(160 160)"><path d="M-60,-60V-155H2A58,58 0 0 1 60,-97V-60Z"/><path transform="rotate(90)" d="M-60,-60V-155H2A58,58 0 0 1 60,-97V-60Z"/><path transform="rotate(180)" d="M-60,-60V-155H2A58,58 0 0 1 60,-97V-60Z"/><path transform="rotate(270)" d="M-60,-60V-155H2A58,58 0 0 1 60,-97V-60Z"/></g></svg><span><b>EUROMEDICA</b><small data-i="brand_sub"></small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-ft">
      <a href="index.html" target="_blank" rel="noopener" data-i="open_app"></a>
      <small data-i="sync_note"></small>
      <button type="button" class="btn btn-s btn-sm" id="resetDemo" data-i="reset_demo"></button>
    </div>
  </aside>
  <div class="main">
    <header class="top">

  var ps=stEnsure().promos||[],card=$('#view .card');if(card&&ps.length)card.insertAdjacentHTML('beforeend',ps.map(function(p){var off=Math.round((1-p.price/p.normal)*100);return '<div class="promo"><div class="ph" style="background:'+BC[p.b]+'">'+esc(p.b==='EUROSKINLAB'?'ESL':p.b==='EUROHAIRLAB'?'EHL':p.b)+'</div><div><span class="pill p-info"><i></i>'+esc(t('pr_sched'))+'</span><h3>'+esc(p.n)+'</h3><span class="muted">'+esc(p.cl.join(', '))+' · '+esc(p.start.replace('T',' '))+' – '+esc(p.end.replace('T',' '))+'</span><div class="pr"><b>'+rp(p.price)+'</b><s>'+rp(p.normal)+'</s><span class="pill p-m">−'+off+'%</span></div><small class="muted" style="display:block;margin-top:4px">'+esc(t('pr_quota'))+' '+p.quota+' · '+esc(t({on:'pr_pay_on',dp:'pr_pay_dp',cl:'pr_pay_cl'}[p.pay]))+'</small></div><div class="ctl"><button type="button" class="btn btn-g btn-sm" data-prdel="'+p.id+'">'+esc(LANG==='en'?'Delete':'Hapus')+'</button></div></div>';}).join(''));};
ROUTES.promo[2]=renderPromo;
var PR_ITEMS=[['Kiloburn 3× course','ESC',4200000],['Lipocav 3× course','SLIM+',4050000],['Hydrawhite double session','SKIN+',2200000],['Hydrolift 50','EUROSKINLAB',2100000],['Scalp recovery programme','EUROHAIRLAB',2400000],['Barrier Repair Moisturiser','SKIN+',420000]];
function openPrDrawer(){var d=document.createElement('div');d.id='drw';var it=PR_ITEMS[0];
  d.innerHTML='<div class="scrim" data-dclose></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dH"><header><h2 id="dH">'+esc(t('pr_drawer'))+'</h2><button type="button" class="ib" data-dclose aria-label="Tutup">'+IC.x+'</button></header><div class="db">'
   +'<div class="fld"><label for="pI">'+esc(t('pr_item'))+'</label><select id="pI">'+PR_ITEMS.map(function(x,i){return '<option value="'+i+'">'+esc(x[0])+' · '+x[1]+'</option>';}).join('')+'</select></div>'
   +'<div class="grid2"><div class="fld"><label for="pN">'+esc(t('pr_normal'))+'</label><input id="pN" inputmode="numeric" value="'+it[2]+'"></div><div class="fld"><label for="pP">'+esc(t('pr_price'))+'</label><input id="pP" inputmode="numeric" value="'+Math.round(it[2]*.7/1000)*1000+'"></div></div>'
   +'<div class="grid2"><div class="fld"><label for="pQ">'+esc(t('pr_quota'))+'</label><input id="pQ" type="number" min="1" value="40"></div><div class="fld"><label>&nbsp;</label><span class="muted" style="font-size:12.5px">'+esc(t('pr_hold'))+'</span></div></div>'
   +'<div class="grid2"><div class="fld"><label for="pS">'+esc(t('pr_start'))+'</label><input id="pS" type="datetime-local" value="2026-11-14T10:00"></div><div class="fld"><label for="pE">'+esc(t('pr_end'))+'</label><input id="pE" type="datetime-local" value="2026-11-14T21:00"></div></div>'
   +'<div class="fld"><label>'+esc(t('pr_elig'))+'</label><div class="ckl" id="pC">'+CL_ALL.map(function(c){return '<label><input type="checkbox" value="'+esc(c)+'"'+(c.indexOf('ESC')===0?' checked':'')+'> '+esc(c)+'</label>';}).join('')+'</div></div>'
   +'<div class="fld"><label>'+esc(t('pr_pay'))+'</label><div class="ckl">'+[['on','pr_pay_on'],['dp','pr_pay_dp'],['cl','pr_pay_cl']].map(function(x,i){return '<label><input type="radio" name="pPay" value="'+x[0]+'"'+(i===0?' checked':'')+'> '+esc(t(x[1]))+'</label>';}).join('')+'</div></div>'
   +'</div><footer style="padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn btn-s" data-dclose>'+esc(LANG==='en'?'Cancel':'Batal')+'</button><button type="button" class="btn btn-p" id="prSave">'+esc(t('pr_create'))+'</button></footer></aside>';
  document.body.appendChild(d);setTimeout(function(){$('#pI').focus();},40);}
document.addEventListener('click',function(e){var x;
  if((x=e.target.closest('[data-msel]'))){MSEL=x.dataset.msel;renderMem();return;}
  if(e.target.closest('#prNew')){openPrDrawer();return;}
  if((x=e.target.closest('[data-prdel]'))){var s=stEnsure();s.promos=(s.promos||[]).filter(function(p){return p.id!==x.dataset.prdel;});stSet(s);renderPromo();return;}
  if(e.target.closest('#prSave')){var it=PR_ITEMS[+$('#pI').value],nm=+($('#pN').value||'').replace(/\D/g,''),pr=+($('#pP').value||'').replace(/\D/g,''),q=+$('#pQ').value||0,cl=$$('#pC input:checked').map(function(i){return i.value;});
    if(!nm||!pr||pr>=nm||q<1||!cl.length){toast(t('pr_need'));return;}var s2=stEnsure();s2.promos=s2.promos||[];s2.promos.push({id:'p'+Date.now(),n:it[0],b:it[1],normal:nm,price:pr,quota:q,start:$('#pS').value,end:$('#pE').value,cl:cl,pay:($$('input[name="pPay"]:checked')[0]||{}).value||'on'});stSet(s2);closeDrawer();renderPromo();toast(t('toast_promo'));return;}
},true);
document.addEventListener('change',function(e){if(e.target.id==='pI'){var it=PR_ITEMS[+e.target.value];$('#pN').value=it[2];$('#pP').value=Math.round(it[2]*.7/1000)*1000;}});
document.addEventListener('input',function(e){if(e.target.id==='mQ'){$('#q').value=e.target.value;var p=e.target.selectionStart;renderMem();var m=$('#mQ');m.focus();m.setSelectionRange(p,p);}});
$('#q').addEventListener('input',function(){if(cur==='members')renderMem();});

window.addEventListener('hashchange',route);
stEnsure();applyLang();route();
})();
